# TONE3000 Plugin - Test gate
# Runs on every push and pull request: build the Release tree on Linux with
# the test suites registered, then run them. This is the cheap gate that
# replaces "merge, then find out build.yml is red" — it carries no signing
# secrets, no packaging, and no macOS/Windows matrix.
#
# The configure step mirrors the Linux half of build.yml (same toolchain
# file, same sccache launchers, same CPM cache key prefix) so this gate
# caches what the full build caches. DspTests is headless — no display
# needed; the UI testbed's self-tests are the JUCE GUI app, which is why
# only that step wraps in xvfb.

name: Test Gate

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  # Compiler cache (GitHub Actions backend, same wiring as build.yml).
  SCCACHE_GHA_ENABLED: "true"

jobs:
  linux-tests:
    name: Linux ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            runs-on: ubuntu-24.04
            os: linux
          - name: aarch64
            runs-on: ubuntu-24.04-arm
            os: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # Same CPM cache as build.yml so a green gate means a warm full build.
      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            libs/juce
            libs/googletest
            libs/clap-juce-extensions
          key: cpm-deps-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt', 'plugin/CMakeLists.txt') }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libgtk-3-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            xvfb

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE=cmake/linux-toolchain.cmake \
            -DBUILD_AAX=OFF \
            -DT3K_BUILD_UI_TESTBED=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 2

      # Headless: DspTests compiles the real DSP plus one UI file (Labels),
      # no window, no sound card.
      - name: Run DSP tests
        run: ctest --test-dir build/test --output-on-failure

      # The UI testbed is a JUCE GUI app: the self-tests (focus policy,
      # widgets, parsers) run against a virtual display.
      - name: Run UI self-tests
        run: xvfb-run -a ctest --test-dir build/plugin/ui/testbed --output-on-failure
